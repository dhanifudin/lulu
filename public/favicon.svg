<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8FB1"/>
      <stop offset="100%" stop-color="#FFC2D1"/>
    </linearGradient>
    <linearGradient id="petal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFE5EC" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <!-- Rounded-square background -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>

  <!-- 5-petal flower centered at 50,50 -->
  <g transform="translate(50,50)">
    <ellipse cx="0" cy="-17" rx="9" ry="14" fill="url(#petal)"/>
    <ellipse cx="0" cy="-17" rx="9" ry="14" fill="url(#petal)" transform="rotate(72)"/>
    <ellipse cx="0" cy="-17" rx="9" ry="14" fill="url(#petal)" transform="rotate(144)"/>
    <ellipse cx="0" cy="-17" rx="9" ry="14" fill="url(#petal)" transform="rotate(216)"/>
    <ellipse cx="0" cy="-17" rx="9" ry="14" fill="url(#petal)" transform="rotate(288)"/>
    <!-- Center -->
    <circle cx="0" cy="0" r="9" fill="#FFF7F0"/>
    <circle cx="0" cy="0" r="6" fill="#FF8FB1"/>
    <circle cx="-2" cy="-2" r="2" fill="white" fill-opacity="0.5"/>
  </g>
</svg>
