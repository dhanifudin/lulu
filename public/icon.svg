<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8FB1"/>
      <stop offset="100%" stop-color="#FFC2D1"/>
    </linearGradient>
    <linearGradient id="petal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#FFE5EC" stop-opacity="0.88"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed gradient background — works as maskable icon -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- 5-petal flower centered at 256,256 (all content within maskable safe zone ≤204px radius) -->
  <g transform="translate(256,256)">
    <!-- Petal 1 -->
    <ellipse cx="0" cy="-88" rx="48" ry="75" fill="url(#petal)"/>
    <!-- Petal 2 (72°) -->
    <ellipse cx="0" cy="-88" rx="48" ry="75" fill="url(#petal)" transform="rotate(72)"/>
    <!-- Petal 3 (144°) -->
    <ellipse cx="0" cy="-88" rx="48" ry="75" fill="url(#petal)" transform="rotate(144)"/>
    <!-- Petal 4 (216°) -->
    <ellipse cx="0" cy="-88" rx="48" ry="75" fill="url(#petal)" transform="rotate(216)"/>
    <!-- Petal 5 (288°) -->
    <ellipse cx="0" cy="-88" rx="48" ry="75" fill="url(#petal)" transform="rotate(288)"/>

    <!-- Center cream circle -->
    <circle cx="0" cy="0" r="46" fill="#FFF7F0"/>
    <!-- Center pink circle -->
    <circle cx="0" cy="0" r="32" fill="#FF8FB1"/>
    <!-- Highlight dot -->
    <circle cx="-10" cy="-10" r="11" fill="white" fill-opacity="0.45"/>
  </g>
</svg>
