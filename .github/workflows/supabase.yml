name: Deploy Supabase

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/supabase.yml'
  workflow_dispatch:

# Never interrupt an in-flight migration
concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Push migrations & deploy functions
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD:  ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF:           ${{ secrets.SUPABASE_PROJECT_REF }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF"

      # Migrations 001-005 were applied manually before CI was set up.
      # Mark them as applied in the remote migration history so db push
      # knows to skip them and only apply 006 (and future migrations).
      - name: Repair migration history
        run: |
          for version in 001 002 003 004 005; do
            supabase migration repair --status applied "$version" || true
          done

      - name: Push database migrations
        run: supabase db push

      - name: Deploy Edge Functions
        run: supabase functions deploy --project-ref "$PROJECT_REF"
